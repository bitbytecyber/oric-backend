version: "3.8"

# Dev server. Values come from `.env` beside this file (see .env.example).

services:
  db:
    image: postgres:17
    restart: always
    ports:
      - 5447:5432
    volumes:
      - oric_backend_postgres_dev:/var/lib/postgresql/data
      - /root/ned_oric_backend/db_backup:/home/pg
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_PORT: ${DATABASE_PORT}
      POSTGRES_HOST: ${DATABASE_HOST}

  mailpit:
    image: axllent/mailpit:latest
    restart: always
    ports:
      - "8035:8025"   # web UI
      - "1035:1025"   # SMTP

  backend:
    image: bitbytecyber/ned-oric-backend:dev
    build: .
    ports:
      - 8102:8000
    restart: always
    depends_on:
      - db
    volumes:
      - /root/ned_oric_backend/dev/media:/app/media
      - /root/ned_oric_backend/dev/static:/app/staticfiles
    environment:
      - COMPOSE_PROJECT_NAME
      - DEBUG
      - SERVE_API_DOCS
      - SECRET_KEY
      - ALLOWED_HOSTS
      - DATABASE_NAME
      - DATABASE_USER
      - DATABASE_PASSWORD
      - DATABASE_HOST
      - DATABASE_PORT
      - DJANGO_SETTINGS_MODULE
      - CORS_ALLOWED_ORIGINS
      - CSRF_TRUSTED_ORIGINS
      - FRONTEND_ORIGIN
      - ALLAUTH_TRUSTED_PROXY_COUNT
      - GOOGLE_OAUTH_CLIENT_ID
      - GOOGLE_OAUTH_CLIENT_SECRET
      - GOOGLE_ALLOWED_DOMAINS
      - APPLE_OAUTH_CLIENT_ID
      - APPLE_TEAM_ID
      - APPLE_KEY_ID
      - APPLE_PRIVATE_KEY
      - EMAIL_HOST
      - EMAIL_PORT
      - EMAIL_HOST_USER
      - EMAIL_HOST_PASSWORD
      - EMAIL_USE_TLS
      - DEFAULT_FROM_EMAIL
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  oric_backend_postgres_dev:
