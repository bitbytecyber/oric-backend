[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["*/migrations/*", ".local", "media", "staticfiles"]

[tool.ruff.lint]
# pyflakes, pycodestyle errors, isort, bugbear, blind-except, pyupgrade, django
select = ["F", "E", "W", "I", "B", "BLE", "UP", "DJ"]
ignore = [
  "E501",   # long lines: wrapped where it helps readability, not mechanically
  "DJ001",  # null=True on CharField is used deliberately for optional unique codes
  "B904",   # `raise ... from` inside except: DomainAPIError carries its own context
  "B905",   # zip() over rows/headers of equal length by construction
  "DJ008",  # __str__ on every model: admin is not used for these
  "E741",   # `l` for "line" in parsers
]

[tool.ruff.lint.per-file-ignores]
# one-off scraping scripts: loop tuples are unpacked for readability, regexes built with %
"tools/*" = ["B007", "UP031", "B005"]

[tool.ruff.lint.isort]
known-first-party = ["audit", "config", "imports", "notifications", "org", "oric_backend", "people", "rbac",
                     "reports", "scorecard", "submissions"]

[tool.ruff.format]
quote-style = "double"
