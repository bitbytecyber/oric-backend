version: "3.8"

# Production. Values come from `.env` beside this file (see .env.example).
# The frontend is a separate image/compose in ../ORIC-frontend (as sis_frontend).

services:
  db:
    image: postgres:17
    restart: always
    ports:
      - 5448:5432
    volumes:
      - oric_backend_postgres_prod:/var/lib/postgresql/data
      - /root/ned_oric_backend/db_backup:/home/pg
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_PORT: ${DATABASE_PORT}
      POSTGRES_HOST: ${DATABASE_HOST}

  backend:
    image: bitbytecyber/ned-oric-backend:prod
    build: .
    # Access logs on stdout for request correlation.
    command: >
      gunicorn oric_backend.wsgi:application
      --workers=3
      --timeout 120
      --bind 0.0.0.0:8000
      --access-logfile -
      --error-logfile -
    ports:
      - 8105:8000
    restart: always
    depends_on:
      - db
    volumes:
      - /root/ned_oric_backend/prod/media:/app/media
      - /root/ned_oric_backend/prod/static:/app/staticfiles
    environment:
      - COMPOSE_PROJECT_NAME
      - DEBUG
      - SECRET_KEY
      - ALLOWED_HOSTS
      - DATABASE_NAME
      - DATABASE_USER
      - DATABASE_PASSWORD
      - DATABASE_HOST
      - DATABASE_PORT
      - DJANGO_SETTINGS_MODULE
      - CORS_ALLOWED_ORIGINS
      - CSRF_TRUSTED_ORIGINS
      - SESSION_COOKIE_DOMAIN
      - CSRF_COOKIE_DOMAIN
      - FRONTEND_ORIGIN
      - ALLAUTH_TRUSTED_PROXY_COUNT
      - GOOGLE_OAUTH_CLIENT_ID
      - GOOGLE_OAUTH_CLIENT_SECRET
      - GOOGLE_ALLOWED_DOMAINS
      - APPLE_OAUTH_CLIENT_ID
      - APPLE_TEAM_ID
      - APPLE_KEY_ID
      - APPLE_PRIVATE_KEY
      - EMAIL_HOST
      - EMAIL_PORT
      - EMAIL_HOST_USER
      - EMAIL_HOST_PASSWORD
      - EMAIL_USE_TLS
      - DEFAULT_FROM_EMAIL

volumes:
  oric_backend_postgres_prod:
