name: Deploy to Oracle Cloud (BitByteCyber's Account).

on:
  pull_request:
    types:
      - closed
    branches:
      - "develop"

env:
  IMAGE_NAME: bitbytecyber/ned_oric_backend
  TAG: dev
  # Everything below lives on the Oracle box. Paths mirror the frontend's
  # (/home/ubuntu/bitbytecyber/sis_frontend/...) — Oracle's Ubuntu image has no
  # root login, so the /root/... layout used by dev.yml/production.yml on EC2
  # does not apply here.
  COMPOSE_FILE: /home/ubuntu/bitbytecyber/ned_oric_backend/docker/docker-compose.dev.yml
  ENV_FILE: /home/ubuntu/bitbytecyber/ned_oric_backend/config/.env.dev

jobs:
  build_and_push:
    name: Push Docker image to Docker Hub
    if: github.event.pull_request.merged == true
    # Native arm64 runner — the target is an Ampere A1 instance. This image is
    # heavy (apt + tesseract + pipenv + a Playwright Chromium download), and
    # building it for linux/arm64 under QEMU emulation on an x86 runner takes
    # the better part of an hour. If arm64 runners are unavailable on this
    # repo's plan, switch back to `ubuntu-latest` and re-add the
    # `docker/setup-qemu-action@v3` step before Buildx — the rest is unchanged.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@ad44023a93711e3deb337508980b4b5e9bcdc5dc
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ env.IMAGE_NAME }}:${{ env.TAG }}
          # Layer cache in the Actions cache. The apt + pipenv + Playwright
          # layers dominate the build and change only when the Pipfile does.
          cache-from: type=gha
          # ignore-error: a cache-export failure ("failed to reserve cache",
          # quota/eviction, service hiccup) must not cancel the image push.
          cache-to: type=gha,mode=max,ignore-error=true

  deploy:
    name: Deploy Docker Container on Oracle Cloud
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          HOST: ${{ secrets.ORACLE_HOST }}
          USERNAME: ${{ secrets.ORACLE_HOST_USERNAME }}
          KEY: ${{ secrets.ORACLE_HOST_KEY }}
          envs: COMPOSE_FILE,ENV_FILE
          script: |
            set -eu

            dc() { docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" "$@"; }

            # Pull first so every step below — including the migration — runs
            # the image this workflow just built, not the one already on disk.
            dc pull

            # Migrations and collectstatic run here, not in the Dockerfile or
            # an entrypoint. dev.yml/production.yml deliberately have no such
            # step and the runbook carries a manual checklist instead; on dev
            # that gap has no upside, and a one-off `run --rm` container is
            # the only place they can run exactly once per deploy rather than
            # once per gunicorn/celery/daphne replica.
            dc run --rm -T backend python manage.py migrate --noinput
            dc run --rm -T backend python manage.py collectstatic --noinput

            dc down
            dc up -d

            # `down && up -d` already replaces the celery workers, which is what
            # picks up newly registered tasks. Surface the resulting state so a
            # container that restart-loops is visible in the workflow log rather
            # than only in a later 502.
            dc ps

      - name: Send email
        if: always()
        uses: dawidd6/action-send-mail@v2
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: ORIC Backend - Dev
          body: ${{ github.job }} job in workflow ${{ github.workflow }} of ${{ github.repository }} has ${{ job.status }}
          to: enganaskhalid@gmail.com,rydaholic@gmail.com
          from: ORIC Backend - Dev


