# docker compose -f /home/ubuntu/bitbytecyber/ned_oric_backend/docker/docker-compose.dev.yml --env-file /home/ubuntu/bitbytecyber/ned_oric_backend/config/.env.dev down && \
# docker compose -f /home/ubuntu/bitbytecyber/ned_oric_backend/docker/docker-compose.dev.yml --env-file /home/ubuntu/bitbytecyber/ned_oric_backend/config/.env.dev up -d