version: "3.8"

# Pinned so the stack is always "oric_local" (containers oric_local-*, volume
# oric_local_oric_postgres) even when started without this folder's .env, e.g. from
# Docker Desktop or an IDE; otherwise Compose names it after the folder ("backend")
# and starts a second, empty copy that collides on ports.
name: oric_local

# Copy `.env.example` to `.env` and adjust, or rely on defaults below.
# In Compose, `DATABASE_HOST` for the app must be the DB service name: `db`.
# Backend uses 8090 like sis_backend, so stop the SIS stack before starting this one.
# The other ports are offset from sis_backend (5432 / 8025 / 1025) so
# both projects can run side by side.

services:
  db:
    image: postgres:17
    restart: always
    ports:
      - "${DATABASE_PORT_HOST:-5442}:5432"
    volumes:
      - oric_postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-oric-local-pass}
      POSTGRES_USER: ${DATABASE_USER:-oric}
      POSTGRES_DB: ${DATABASE_NAME:-oric-local}

  mailpit:
    image: axllent/mailpit:latest
    restart: always
    ports:
      - "8035:8025"   # web UI -> http://localhost:8035
      - "1035:1025"   # SMTP

  backend:
    image: oric-backend:local
    build: .
    ports:
      - 8090:8000
    restart: always
    depends_on:
      - db
      - mailpit
    volumes: #This is done for sharing source code with the container
      - ./:/app/
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-oric_local}
      DEBUG: ${DEBUG:-1}
      SERVE_API_DOCS: ${SERVE_API_DOCS:-1}
      SECRET_KEY: ${SECRET_KEY:-local-dev-change-me}
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-0}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      ALLAUTH_TRUSTED_PROXY_COUNT: ${ALLAUTH_TRUSTED_PROXY_COUNT:-0}
      DATABASE_NAME: ${DATABASE_NAME:-oric-local}
      DATABASE_USER: ${DATABASE_USER:-oric}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-oric-local-pass}
      DATABASE_HOST: ${DATABASE_HOST:-db}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-oric_backend.settings.dev}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
      APPLE_OAUTH_CLIENT_ID: ${APPLE_OAUTH_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      ORIC_DEMO_PASSWORD: ${ORIC_DEMO_PASSWORD:-}

volumes:
  oric_postgres:
